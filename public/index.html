<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEBULA</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Tata letak: sidebar tetap + konten satu kolom; di layar kecil sidebar jadi tab bawah. Satu tema terang (latar putih keabu-abuan). */
:root{
  --bg:#F4F4F2; --card:#FFFFFF; --line:#E3DFD2; --ink:#4A3F35; --muted:#6A5D4E;
  --accent:#B5601A; --accent-fill:#D98B3F; --accent-soft:#FBEBC8; --brown:#8B6F5A;
  --income:#2a78d6; --income-ink:#2F67AD; --expense:#eb6834; --expense-ink:#B5532C; --good:#2F7D4F;
  --shadow:0 2px 10px rgba(74,63,53,.07);
  --display:'Baloo 2',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #2a78d6;outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:28px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;overflow:hidden}
.side .blob{position:absolute;pointer-events:none;opacity:.55}
.side>*:not(.blob){position:relative}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px;margin-bottom:8px}
.tagbox{padding:0 10px;margin-bottom:22px}
.tagbox i{display:block;font-size:12.5px;color:var(--ink);font-family:var(--display);font-weight:500}
.tagbox span{display:block;font-size:9.5px;letter-spacing:.07em;font-weight:700;color:var(--muted);margin-top:3px;line-height:1.35}
.brand .logo{width:34px;height:34px;border-radius:12px;background:var(--accent-fill);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700}
.brand b{font-family:var(--display);font-size:20px;letter-spacing:.08em}
.brand .icon-btn{margin-left:auto}
.showside{display:none;position:fixed;top:14px;left:14px;z-index:25;width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--accent);cursor:pointer;place-items:center;padding:0}
.showside:hover{background:var(--accent-soft)}
.app.collapsed{grid-template-columns:minmax(0,1fr)}
.app.collapsed .side{display:none}
.app.collapsed main{padding-top:72px}
.app.collapsed ~ .showside{display:grid}
.navlink{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-weight:600;color:var(--muted)}
.navlink:hover{color:var(--ink);background:rgba(251,235,200,.5)}
.navlink[aria-current=page]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.side .streak{margin-top:auto;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.side .streak .row{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.badge-ic{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#FDEBD1;color:#C9762E;flex-shrink:0}
.side small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.store{margin-top:10px;font-size:11.5px;color:var(--muted)}
main{padding:58px clamp(16px,4vw,48px) 48px;min-width:0;outline:none}
.wrap{max-width:980px;display:flex;flex-direction:column;gap:22px}
h1{font-size:28px;line-height:1.2}
.sub{color:var(--muted);margin:4px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.card h2{font-size:18px;margin-bottom:12px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(290px,100%),1fr))}
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.tile .lbl{font-size:12.5px;font-weight:700;color:var(--muted)}
.tile .val{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.2;margin:2px 0;font-variant-numeric:tabular-nums}
.tile .dlt{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.inc{color:var(--income-ink)} .exp{color:var(--expense-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#B5601A;color:#fff;border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(181,96,26,.25)}
.btn:hover{background:#9E5215}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:none;border:1.5px solid var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.small{padding:6px 14px;font-size:13px}
.link{color:var(--accent);font-weight:700;display:inline-flex;align-items:center;gap:4px}
.link:hover{text-decoration:underline}
.banner{position:relative;overflow:hidden;background:var(--brown);color:#fff;border-radius:22px;padding:26px 30px;box-shadow:0 10px 26px rgba(139,111,90,.28)}
.banner .eyebrow{font-size:12.5px;font-weight:700;color:#F0D9B8;letter-spacing:.04em;text-transform:uppercase}
.banner h2{font-size:22px;margin:4px 0 14px;max-width:420px;color:#fff}
.banner .btn{background:#F0C66B;color:#4A3F35;box-shadow:none}
.banner .btn:hover{background:#F5D285}
.banner svg.mascot{position:absolute;right:18px;bottom:-10px}
.urgent{background:#FDF1DD;border:1.5px solid #F0C66B;box-shadow:0 6px 18px rgba(217,98,46,.12)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px}
.pill.hot{background:#B8481F;color:#fff}
.pill.soft{background:#F4F4F2;border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:12px}
.pill.late{background:#FBE4DB;color:#8F3412}
.bignum{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1}
.warn{color:#8F3412;font-weight:700;display:flex;gap:6px;align-items:center}
.muted{color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.row-card{display:flex;align-items:center;gap:14px;padding:13px 16px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shadow)}
.row-card .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row-card.done .t{text-decoration:line-through;color:#A39887}
.check{width:26px;height:26px;border-radius:50%;border:2px solid #CDBF9F;background:#fff;color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;flex-shrink:0}
.check[aria-pressed=true]{background:#7DB07A;border-color:#7DB07A}
.icon-btn{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;border-radius:10px;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--accent-soft);color:var(--accent)}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 5px}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
textarea{min-height:72px;resize:vertical}
.inline-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.inline-form>div{flex:1 1 160px}
.inline-form>div.grow{flex:3 1 240px}
.inline-form label{margin-top:0}
.seg{display:flex;gap:4px;background:#EAE8E0;border-radius:999px;padding:4px;width:max-content;max-width:100%}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 16px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(74,63,53,.15)}
.seg button.on.in{color:var(--income-ink)} .seg button.on.out{color:var(--expense-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed=true]{background:#FDF1DD;border-color:var(--accent-fill);color:var(--accent)}
.chip.static{cursor:default;padding:4px 10px;font-size:12px}
.why{background:#FAFAF7;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.why .cols{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));margin-top:10px}
.why .mini{background:var(--card);border-radius:12px;padding:12px;font-size:13px;color:var(--muted)}
.why .mini b{display:flex;gap:6px;align-items:center;color:var(--ink);font-size:13.5px;margin-bottom:4px}
.month{display:flex;align-items:center;gap:6px}
.month strong{min-width:150px;text-align:center;font-family:var(--display);font-size:18px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(100px,190px) minmax(0,1fr) 170px;gap:12px;align-items:center;font-size:14px}
.track{height:12px;background:#E9E6DB;border-radius:999px;overflow:hidden}
.fill{height:100%;background:var(--expense);border-radius:0 999px 999px 0}
.bar-row .amt{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:480px;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.insights{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.insights li{display:flex;gap:10px;align-items:flex-start}
.insights .badge-ic{margin-top:1px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;color:var(--muted);padding:8px 10px;border-bottom:1.5px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
details summary{cursor:pointer;font-weight:700;color:var(--accent);margin-top:12px}
.note{background:#FFF6D5;border:1px dashed #D9C77A;border-radius:14px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.chat{display:flex;flex-direction:column;gap:12px;max-width:680px}
.msg{padding:13px 16px;border-radius:16px;max-width:88%;box-shadow:var(--shadow);overflow-wrap:anywhere}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 4px}
.msg.me{align-self:flex-end;background:#B5601A;color:#fff;border-radius:16px 16px 4px 16px}
.msg ol{margin:8px 0;padding-left:20px}
.msg .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chatbar{display:flex;gap:10px;max-width:680px}
.chatbar input{border-radius:999px;padding:11px 18px}
.mode{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;display:none;gap:12px;align-items:center;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.show{display:flex}
.toast button{background:none;border:0;color:#F0C66B;font-weight:700;cursor:pointer}
#tip{position:fixed;z-index:40;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;padding:6px 10px;border-radius:8px;display:none;max-width:260px}
.msgline{font-size:13px;min-height:20px;margin:8px 0 0}
.msgline.err{color:#8F3412;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:22px}
.ck-grid{grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));align-items:start}
.ck-day{padding:18px 20px}
.ck-day.today{background:#FFF7CC;border-color:#F0C66B;box-shadow:0 6px 18px rgba(240,198,107,.3)}
.ck-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ck-head h3{font-size:16px;flex:1}
.ck-count{font-size:12.5px;font-weight:700;color:var(--muted)}
.ck-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.ck-item{display:flex;align-items:center;gap:10px;padding:2px 0}
.ck-dot{width:24px;height:24px;border-radius:50%;border:2px solid #9C8F70;background:transparent;display:inline-grid;place-items:center;padding:0;cursor:pointer;flex-shrink:0;color:#4A3F35}
.ck-dot[aria-pressed=true]{background:#F0C66B;border-color:#F0C66B}
.ck-dot.add{border-style:dashed;color:var(--accent);cursor:inherit}
.ck-dot.sm{width:18px;height:18px;cursor:default;margin-top:2px}
.ck-dot.sm:not(.off){background:#F0C66B;border-color:#F0C66B}
input[type=text].ck-title{flex:1;min-width:0;border:0;background:transparent;padding:6px 6px;border-radius:8px;font-size:15px}
input[type=text].ck-title:focus{background:#fff}
.ck-item.on .ck-title{color:var(--muted)}
.ck-item .icon-btn{opacity:.5}
.ck-item:hover .icon-btn,.ck-item .icon-btn:focus-visible{opacity:1}
.ck-add{display:flex;align-items:center;gap:10px;background:none;border:0;padding:5px 0;cursor:pointer;color:var(--accent);font-weight:700;width:100%;text-align:left;border-radius:8px}
.ck-add:hover .ck-dot.add{background:var(--accent-soft)}
.tint .ck-add{color:var(--tk)}
.weeknav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.weeknav strong{min-width:190px;text-align:center;font-family:var(--display);font-size:17px}
.autosum{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.autosum.empty-sum{background:#FFF7CC;border-color:#F0C66B}
.autosum p{margin:6px 0 10px}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.sumh{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.sumlist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.sumlist li{display:flex;gap:8px;align-items:flex-start}
.small{font-size:12.5px}
.eyebrow2{font-size:11.5px;font-weight:700;letter-spacing:.09em;color:var(--tk);margin-bottom:2px}
.rows{display:flex;flex-direction:column;gap:12px}
.rowc{border-radius:20px;background:var(--tb);border:1px solid var(--tbl);box-shadow:var(--shadow)}
.rowc>summary{list-style:none;display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer;border-radius:20px;user-select:none}
.rowc>summary::-webkit-details-marker{display:none}
.rowc>summary:hover{background:rgba(255,255,255,.4)}
.rs-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.rs-txt b{font-family:var(--display);font-size:17px;color:var(--tk);line-height:1.25}
.rs-sum{font-size:13.5px;color:var(--tk);overflow-wrap:anywhere}
.rowc .chev{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--tf);flex-shrink:0;transition:transform .2s}
.rowc[open] .chev{transform:rotate(180deg)}
.rowc[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
.rbody{padding:4px 22px 22px}
.rbody .link{color:var(--tk);text-decoration:underline}
.hico.big{width:42px;height:42px;border-radius:14px}
.remind{display:flex;align-items:flex-start;gap:12px;background:var(--tb);border:1.5px solid var(--tbl);border-radius:18px;padding:14px 18px;flex-wrap:wrap}
.remind .rtxt{flex:1;min-width:220px;color:var(--tk)}
.remind ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.remind li{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.remind .pill{background:#fff}
.gh{font-size:15px;margin:14px 0 8px;color:var(--ink)}
.sech{font-size:18px;margin:6px 0 12px}
.feat{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.feat:hover{background:#FBF8F0;border-color:#E3D2A8}
.feat .rs-txt b{color:var(--ink)}
.feat .rs-sum{color:var(--muted)}
.feat .chev0{color:var(--muted);display:grid;place-items:center}
.goal{background:#fff;align-items:flex-start}
.goal .t{display:flex;flex-direction:column;gap:6px}
.gmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.gprog{display:flex;align-items:center;gap:10px}
.gprog input[type=range]{flex:1;max-width:260px;accent-color:#2F7D4F}
.gpct{font-size:12.5px;font-weight:700;min-width:36px;color:var(--ink)}
.pill.near{background:#FBF0BE;color:#574106}
.goalhint{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.empty svg{display:block;margin:0 auto 6px}
.empty p{margin:0}
/* tema warna pastel: dipakai di header halaman, kartu, ikon */
.t-peach{--tb:#FDEBD1;--tf:#C9762E;--tk:#6E4210;--tbl:#F5D3A3}
.t-mint{--tb:#E3F2DC;--tf:#2F7D4F;--tk:#1B4F31;--tbl:#BFE0B4}
.t-sky{--tb:#E1EDFB;--tf:#2a78d6;--tk:#1B4A86;--tbl:#B7D3F3}
.t-lilac{--tb:#ECE6F7;--tf:#6B58A8;--tk:#3F3270;--tbl:#D3C8EC}
.t-butter{--tb:#FBF0BE;--tf:#8A6A12;--tk:#574106;--tbl:#F0DC86}
.t-coral{--tb:#FCE3D9;--tf:#B8481F;--tk:#7E2E0F;--tbl:#F5C2AE}
.bgdeco{position:fixed;inset:0;z-index:0;pointer-events:none}
.bgdeco svg{display:block}
.app{position:relative;z-index:1}
.wrap{margin-inline:auto}
.phead{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;padding:24px 28px;min-height:112px;border-radius:24px;background:var(--tb);border:1px solid var(--tbl);box-shadow:var(--shadow)}
.phead>*{position:relative;z-index:1}
.phead>svg.deco{position:absolute;z-index:0;right:0;top:0;height:100%;width:300px}
.phead h1{color:var(--tk)}
.phead .sub{color:var(--tk);max-width:460px}
.d1{fill:var(--tbl)} .d2{fill:var(--tf);opacity:.2} .d3{fill:var(--tf);opacity:.55}
.pico{flex-shrink:0;width:56px;height:56px;border-radius:18px;background:#fff;color:var(--tf);display:grid;place-items:center;box-shadow:0 4px 12px rgba(74,63,53,.1)}
.phead .month{margin-left:auto;background:rgba(255,255,255,.8);border-radius:999px;padding:4px 8px}
.ptxt{min-width:0}
.prog{height:10px;background:rgba(255,255,255,.8);border-radius:999px;overflow:hidden;margin-top:12px;max-width:320px}
.prog i{display:block;height:100%;background:var(--tf);border-radius:999px}
.progtxt{font-size:13px;font-weight:700;color:var(--tk);margin-top:5px}
.hico{display:inline-grid;place-items:center;flex-shrink:0;width:30px;height:30px;border-radius:10px;background:#fff;color:var(--tf);border:1px solid var(--tbl)}
.h2b,.ctitle{display:flex;align-items:center;gap:10px}
.h2b{color:var(--ink)}
.ctitle{font-weight:700;font-size:14px;color:var(--tk);margin-bottom:10px}
.ctitle.nm{margin:0}
.card.tint,.panel.tint{background:var(--tb);border-color:var(--tbl)}
.panel{border:1px solid var(--tbl);border-radius:18px;padding:16px 18px}
.panel .badge-ic,.mini .badge-ic{background:#fff!important}
.tint .muted{color:var(--tk)}
.tint .link,.mini .link{color:var(--tk);text-decoration:underline}
.tile{position:relative;background:var(--tb);border-color:var(--tbl);background:color-mix(in srgb,var(--tb) 42%,#fff);border-color:color-mix(in srgb,var(--tbl) 50%,#fff)}
.tile .lbl,.tile .dlt{color:var(--tk)}

<body>
<div class="bgdeco" aria-hidden="true"><svg viewBox="0 0 1000 800" preserveAspectRatio="xMaxYMax slice" width="100%" height="100%"><circle cx="940" cy="80" r="200" fill="#FDEBD1" opacity=".75"/><circle cx="900" cy="770" r="240" fill="#E3F2DC" opacity=".8"/><circle cx="520" cy="840" r="130" fill="#E1EDFB" opacity=".75"/><circle cx="650" cy="330" r="70" fill="#ECE6F7" opacity=".6"/><circle cx="300" cy="60" r="60" fill="#FBF0BE" opacity=".7"/></svg></div>
<div class="app">
  <nav class="side" id="nav" aria-label="Menu utama"></nav>
  <main id="view" tabindex="-1"></main>
</div>
<button class="showside" id="showside" type="button" data-act="side-toggle" aria-label="Tampilkan menu" title="Tampilkan menu"></button>
<div id="acct" class="acct" hidden></div>
<div id="authmodal" class="authmodal" hidden>
  <div class="authbox" role="dialog" aria-modal="true" aria-labelledby="auth-title">
    <h2 id="auth-title">Masuk ke NEBULA</h2>
    <p id="auth-sub">Simpan datamu di akun supaya ikut ke semua perangkat dan Fokus AI aktif.</p>

      <div class="authrow"><button type="submit" class="pri" id="auth-submit">Masuk</button><button type="button" id="auth-signup">Daftar</button></div>
      <button type="button" class="authlink" id="auth-forgot">Lupa kata sandi?</button>
      <div class="authmsg" id="auth-msg" role="status"></div>

  </div>
</div>

<div id="toast" class="toast" role="status"></div>

<script>
(function(){
'use strict';

// ISI KONTAK SUPPORT DI SINI; menu Support baru muncul setelah salah satunya terisi (nomor WhatsApp pakai kode negara, mis. '6281234567890' atau '081234567890'; Instagram tanpa '@').
const SUPPORT={name:'',wa:'',ig:''};
const HAS_SUPPORT=!!(String(SUPPORT.wa).replace(/\D/g,'')||String(SUPPORT.ig).replace(/^@/,'').trim());

// <logic>
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd = s => { const p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); };
const addDays = (d,n) => { const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; };
const monthKey = s => s.slice(0,7);
const shiftMonth = (key,n) => { const p=key.split('-').map(Number); const d=new Date(p[0],p[1]-1+n,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); };
const MONTHS = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const MON3 = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const monthLabel = key => { const p=key.split('-').map(Number); return MONTHS[p[1]-1]+' '+p[0]; };
const monthShort = key => { const p=key.split('-').map(Number); return MON3[p[1]-1]+' '+String(p[0]).slice(2); };
const dayLabel = s => { const d=parseYmd(s); return d.getDate()+' '+MON3[d.getMonth()]; };
const rp = n => (n<0?'-':'')+'Rp'+Math.round(Math.abs(n)).toLocaleString('id-ID');
const shortRp = v => v>=1e6 ? (Math.round(v/1e5)/10).toString().replace('.',',')+' jt' : v>=1e3 ? Math.round(v/1e3)+' rb' : String(Math.round(v));
const niceMax = v => { if(v<=0) return 1000; const e=Math.pow(10,Math.floor(Math.log10(v))); const f=v/e; const m=f<=1?1:f<=2?2:f<=5?5:10; return m*e; };

const EXP_CATS = ['Makan & minum','Transport','Tempat tinggal','Kuliah & buku','Hiburan','Kesehatan & olahraga','Lainnya'];
const INC_CATS = ['Kiriman orang tua','Beasiswa','Kerja paruh waktu','Lainnya'];

function summarize(tx,key){
  let income=0, expense=0; const cat={};
  tx.forEach(t=>{
    if(monthKey(t.date)!==key) return;
    if(t.type==='in') income+=t.amount;
    else { expense+=t.amount; cat[t.cat]=(cat[t.cat]||0)+t.amount; }
  });
  const byCat = Object.keys(cat).map(k=>({cat:k,amount:cat[k]})).sort((a,b)=>b.amount-a.amount);
  return {income,expense,balance:income-expense,byCat,rate:income>0?(income-expense)/income:null};
}
function trend(tx,key,n){
  const out=[]; for(let i=n-1;i>=0;i--){ const k=shiftMonth(key,-i); const s=summarize(tx,k); out.push({key:k,income:s.income,expense:s.expense}); } return out;
}
function pctChange(cur,prev){ return prev>0 ? (cur-prev)/prev : null; }

function splitTasks(text,today){
  let dl = 0; const low=text.toLowerCase();
  if(/hari ini/.test(low)) dl=0; else if(/besok/.test(low)) dl=1; else if(/lusa/.test(low)) dl=2; else if(/minggu depan|pekan depan/.test(low)) dl=7; else if(/bulan depan/.test(low)) dl=30;
  const parts = text.replace(/\s+(untuk|buat)\s+(hari ini|besok|lusa|minggu depan|pekan depan|bulan depan).*$/i,'')
    .split(/[\n;]|,\s*|\s+dan\s+/i)
    .map(s=>s.trim().replace(/^dan\s+/i,'').replace(/^(?:(?:aku|saya|gue)\s+)?(?:(?:harus|perlu|mau|ingin|tolong)\s+)?/i,'').replace(/[.!]+$/,'').trim())
    .filter(s=>s.length>2);
  const deadline = ymd(addDays(today,dl));
  return parts.slice(0,8).map(s=>({title:s.charAt(0).toUpperCase()+s.slice(1,90),deadline}));
}

function streak(refl,todayStr){
  const dates=new Set(refl.map(r=>r.date)); let d=parseYmd(todayStr); if(!dates.has(ymd(d))) d=addDays(d,-1);
  let n=0; while(dates.has(ymd(d))){ n++; d=addDays(d,-1); } return n;
}
function weekStart(today){ const d=new Date(today.getFullYear(),today.getMonth(),today.getDate()); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return d; }

const FLAGS = {tidur:'Kurang tidur',keuangan:'Mikirin keuangan',olahraga:'Jarang gerak',oke:'Semuanya oke'};
function patterns(refl,tasks,checks){
  if(refl.length<14) return {ready:false,need:14-refl.length};
  const doneBy={}; tasks.forEach(t=>{ if(t.done&&t.doneAt) doneBy[t.doneAt]=(doneBy[t.doneAt]||0)+1; });
  (checks||[]).forEach(c=>{ if(c.done&&c.title&&c.title.trim()) doneBy[c.date]=(doneBy[c.date]||0)+1; });
  const items=[];
  ['tidur','keuangan','olahraga'].forEach(f=>{
    const a=refl.filter(r=>r.checkin.indexOf(f)>=0), b=refl.filter(r=>r.checkin.indexOf(f)<0);
    if(a.length>=3&&b.length>=3){
      const avg=x=>x.reduce((s,r)=>s+(doneBy[r.date]||0),0)/x.length;
      items.push({flag:f,n:a.length,withFlag:avg(a),without:avg(b)});
    }
  });
  return {ready:true,items};
}

function insights(tx,key,refl,todayStr){
  const s=summarize(tx,key), p=summarize(tx,shiftMonth(key,-1)), out=[];
  if(s.income===0 && s.expense===0) return [{ic:'alert',t:'Belum ada transaksi di bulan ini.'}];
  if(s.byCat.length){ const top=s.byCat[0]; out.push({ic:'coin',t:'Pengeluaran terbesar: '+top.cat+' ('+rp(top.amount)+', '+Math.round(top.amount/s.expense*100)+'% dari total).'}); }
  const ch=pctChange(s.expense,p.expense);
  if(ch!==null) out.push({ic:ch>0?'up':'down',t:'Pengeluaran '+(ch>0?'naik ':'turun ')+Math.abs(Math.round(ch*100))+'% dibanding '+monthLabel(shiftMonth(key,-1))+' ('+rp(p.expense)+').'});
  if(s.income>0){
    if(s.balance>=0) out.push({ic:'check',t:'Kamu menyisihkan '+Math.round(s.rate*100)+'% dari pemasukan ('+rp(s.balance)+').'});
    else out.push({ic:'alert',t:'Pengeluaran melebihi pemasukan sebesar '+rp(-s.balance)+'.'});
  } else if(s.expense>0) out.push({ic:'alert',t:'Belum ada pemasukan tercatat bulan ini, jadi saldo mengikuti pengeluaran saja.'});
  const isCur = key===monthKey(todayStr);
  const days = isCur ? parseYmd(todayStr).getDate() : new Date(+key.slice(0,4),+key.slice(5,7),0).getDate();
  if(s.expense>0) out.push({ic:'coin',t:'Rata-rata pengeluaran '+rp(s.expense/days)+' per hari'+(isCur?' (sampai hari ini)':'')+'.'});
  const worry = refl.filter(r=>monthKey(r.date)===key && r.checkin.indexOf('keuangan')>=0).length;
  if(worry>0) out.push({ic:'moon',t:'Di '+worry+' hari refleksi bulan ini kamu menandai "Mikirin keuangan".'});
  return out;
}

const GOAL_NEAR={short:3,long:14};
function goalInfo(g,todayS){
  const days=Math.round((parseYmd(g.due)-parseYmd(todayS))/86400000);
  const near=!g.done&&days<=GOAL_NEAR[g.term];
  const txt=g.done?'Tercapai':days<0?'Lewat '+(-days)+' hari':days===0?'Hari ini':days+' hari lagi';
  return {days:days,near:near,txt:txt};
}
function toCsv(rows){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  return ['Tanggal,Jenis,Kategori,Catatan,Nominal'].concat(rows.map(t=>[t.date,t.type==='in'?'Pemasukan':'Pengeluaran',t.cat,t.note||'',t.amount].map(q).join(','))).join('\n');
}
// </logic>

const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayDate = () => new Date();
const todayStr = () => ymd(todayDate());

/* ---------- Data contoh ---------- */
function seed(){
  const t=todayDate(), tk=monthKey(ymd(t));
  const base=[
    [1,'in','Kiriman orang tua',1500000,'Kiriman bulanan'],[3,'out','Tempat tinggal',600000,'Bayar kos'],
    [5,'out','Makan & minum',185000,'Belanja mingguan'],[8,'out','Kuliah & buku',120000,'Fotokopi dan cetak'],
    [10,'out','Transport',75000,'Isi bensin'],[12,'in','Kerja paruh waktu',550000,'Asisten dosen'],
    [14,'out','Makan & minum',210000,'Makan bareng teman'],[17,'out','Hiburan',90000,'Nonton'],
    [19,'out','Kesehatan & olahraga',60000,'Futsal'],[21,'out','Makan & minum',160000,'Belanja mingguan'],
    [24,'out','Transport',70000,'Ojek online'],[27,'out','Kuliah & buku',250000,'Buku referensi']
  ];
  const f=[1,0.9,1.1,1.05,0.95,1.0], tx=[];
  for(let i=0;i<6;i++){
    const key=shiftMonth(tk,-i);
    base.forEach((b,j)=>{
      if(i===0 && b[0]>t.getDate()) return;
      tx.push({id:'s'+i+'_'+j,date:key+'-'+pad(b[0]),type:b[1],cat:b[2],amount:b[1]==='in'&&b[2]==='Kiriman orang tua'?b[3]:Math.round(b[3]*f[i]/1000)*1000,note:b[4]});
    });
    if(i===3) tx.push({id:'s'+i+'_b',date:key+'-15',type:'in',cat:'Beasiswa',amount:1000000,note:'Cair semester'});
  }
  const refl=[
    {date:ymd(addDays(t,-1)),selesai:'Selesai baca abstrak 2 paper.',belum:'Laporan belum dimulai.',hambatan:'Kelas sampai sore.',checkin:['tidur']},
    {date:ymd(addDays(t,-2)),selesai:'Submit draft proposal.',belum:'-',hambatan:'Lumayan lancar.',checkin:['oke']}
  ];
  const yd=ymd(addDays(t,-1)), td=ymd(t), tm=ymd(addDays(t,1));
  const checks=[
    ['Progres paper bareng kelompok',yd,1],['Kerjain tugas praktikum',yd,1],['Meet bahas proposal',yd,1],['Bahas jadwal presentasi',yd,0],['Revisi konten slide',yd,1],
    ['Kelas pagi',td,1],['Baca 1 paper',td,1],['Kerjain laporan praktikum',td,0],['Meet kelompok jam 19.30',td,0],
    ['Kelas statistik',tm,0],['Review slide presentasi',tm,0]
  ].map((c,i)=>({id:'c'+i,title:c[0],date:c[1],done:!!c[2]}));
  const goals=[
    {id:'g1',title:'Selesaikan draft laporan praktikum',term:'short',due:ymd(addDays(t,2)),done:false,progress:60},
    {id:'g2',title:'Konsisten isi checklist 7 hari',term:'short',due:ymd(addDays(t,6)),done:false,progress:30},
    {id:'g3',title:'Lulus mata kuliah statistik dengan nilai A',term:'long',due:ymd(addDays(t,60)),done:false,progress:25},
    {id:'g4',title:'Bab 1 sampai 3 skripsi rampung',term:'long',due:ymd(addDays(t,100)),done:false,progress:10}
  ];
  return {v:1,demo:true,tasks:[],tx,refl,checks,goals};
}
function blank(){ return {v:1,demo:false,tasks:[],tx:[],refl:[],checks:[],goals:[]}; }
function normalize(d){
  return {v:1,demo:!!d.demo,tasks:Array.isArray(d.tasks)?d.tasks:[],tx:Array.isArray(d.tx)?d.tx:[],refl:Array.isArray(d.refl)?d.refl:[],checks:Array.isArray(d.checks)?d.checks:[],goals:Array.isArray(d.goals)?d.goals:[]};
}

/* ---------- Penyimpanan ---------- */
const LS='focusos-v1';
let S=null, ref=null, storeMode='loading', touched=false;
try{ const raw=localStorage.getItem(LS); if(raw) S=normalize(JSON.parse(raw)); }catch(e){}
if(!S) S=blank();
function serial(){ return Object.assign({},S,{checks:S.checks.filter(c=>c.title.trim())}); }
function saveLocal(){ try{ localStorage.setItem(LS,JSON.stringify(serial())); }catch(e){} }
let saveTimer=null, saving=false, pending=false;
async function flush(){
  if(!ref) return;
  if(saving){ pending=true; return; }
  saving=true;
  try{ await ref.set(JSON.parse(JSON.stringify(serial()))); setStatus('db'); }catch(e){ setStatus('local'); }
  saving=false;
  if(pending){ pending=false; flush(); }
}
function save(){ touched=true; saveLocal(); if(ref){ clearTimeout(saveTimer); saveTimer=setTimeout(flush,700); } }
function setStatus(m){ storeMode=m; const el=document.getElementById('store'); if(el) el.textContent=statusText(); }
function statusText(){ return storeMode==='db'?'Tersimpan privat di akunmu.':storeMode==='local'?(sb?'Tersimpan di browser ini saja. Masuk untuk menyimpan ke akunmu.':'Tersimpan di browser ini saja.'):'Memuat penyimpanan...'; }
const withTimeout=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);
const CFG=window.NEBULA_CONFIG||{};
let sb=null, session=null;
if(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase&&window.supabase.createClient){
  try{ sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}); }catch(e){ sb=null; }
}
const uidOf=s=>s&&s.user?s.user.id:null;

async function loadCloud(){
  const uid=uidOf(session); if(!sb||!uid) return;
  try{
    const res=await withTimeout(sb.from('user_data').select('data').eq('user_id',uid).maybeSingle(),10000);
    if(!res||res.error){ ref=null; setStatus('local'); return; }
    ref={ set:async d=>{ const r=await sb.from('user_data').upsert({user_id:uid,data:d,updated_at:new Date().toISOString()}); if(r.error) throw r.error; } };
    const d=res.data&&res.data.data;
    if(d&&Array.isArray(d.tx)&&Array.isArray(d.tasks)){ S=normalize(d); saveLocal(); if(touched) toast('Data dari akunmu dimuat. Perubahan dalam beberapa detik pertama tidak ikut tersimpan.'); }
    else { flush(); }
    setStatus('db'); render();
  }catch(e){ ref=null; setStatus('local'); }
}

async function initDb(){
  if(!sb){ setStatus('local'); renderAcct(); return; }
  try{ const r=await withTimeout(sb.auth.getSession(),8000); session=r&&r.data?r.data.session:null; }catch(e){ session=null; }
  renderAcct();
  sb.auth.onAuthStateChange((ev,s)=>{
    const prev=uidOf(session); session=s; const now=uidOf(s);
    renderAcct();
    if(ev==='PASSWORD_RECOVERY'){ setTimeout(()=>openAuth('recovery'),0); return; }
    if(ev==='SIGNED_OUT'){
      clearTimeout(saveTimer); ref=null; S=blank();
      try{ localStorage.removeItem(LS); }catch(e){}
      setStatus('local'); render(); return;
    }
    if(now&&now!==prev) setTimeout(loadCloud,0);
  });
  if(session) await loadCloud(); else setStatus('local');
}

/* ---------- Akun & login ---------- */
const $a=id=>document.getElementById(id);
let authMode='in';
function renderAcct(){
  const el=$a('acct'); if(!el) return;
  if(!sb){ el.hidden=true; return; }
  el.hidden=false;
  el.innerHTML=session
    ? '<span class="acct-mail">'+esc((session.user&&session.user.email)||'')+'</span><button type="button" class="acct-btn" id="auth-out">Keluar</button>'
    : '<button type="button" class="acct-btn" id="auth-open">Masuk / Daftar</button>';
}
function authMsg(t,ok){ const m=$a('auth-msg'); m.textContent=t||''; m.classList.toggle('ok',!!ok); }
function openAuth(mode){
  authMode=mode||'in';
  const rec=authMode==='recovery';
  $a('auth-title').textContent=rec?'Buat kata sandi baru':'Masuk ke NEBULA';
  $a('auth-sub').textContent=rec?'Masukkan kata sandi baru untuk akunmu (minimal 8 karakter).':'Simpan datamu di akun supaya ikut ke semua perangkat dan Fokus AI aktif.';
  $a('auth-google').hidden=rec; $a('auth-or').hidden=rec; $a('auth-email-wrap').hidden=rec; $a('auth-signup').hidden=rec; $a('auth-forgot').hidden=rec; $a('auth-close').hidden=rec;
  $a('auth-submit').textContent=rec?'Simpan kata sandi':'Masuk';
  $a('auth-pw').autocomplete=rec?'new-password':'current-password';
  $a('auth-pw').value=''; authMsg('');
  $a('authmodal').hidden=false;
  setTimeout(()=>{ const f=rec?$a('auth-pw'):$a('auth-email'); if(f) f.focus(); },0);
}
function closeAuth(){ $a('authmodal').hidden=true; authMsg(''); }
function authErr(e){
  const m=String((e&&e.message)||'');
  if(/invalid login/i.test(m)) return 'Email atau kata sandi salah.';
  if(/already registered/i.test(m)) return 'Email ini sudah terdaftar. Coba masuk.';
  if(/provider is not enabled|unsupported provider/i.test(m)) return 'Login Google belum diaktifkan di Supabase.';
  if(/not confirmed/i.test(m)) return 'Email belum dikonfirmasi. Cek kotak masukmu.';
  if(/rate limit|too many/i.test(m)) return 'Terlalu banyak percobaan. Coba lagi beberapa menit lagi.';
  if(/password/i.test(m)) return 'Kata sandi tidak memenuhi syarat (minimal 8 karakter).';
  return 'Gagal: '+(m||'coba lagi.');
}
const validEmail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
function authBusy(b){ ['auth-submit','auth-signup','auth-forgot','auth-google'].forEach(i=>{ const el=$a(i); if(el) el.disabled=b; }); }
const backUrl=()=>location.origin+location.pathname;

document.addEventListener('click',async e=>{
  const t=e.target; if(!t||!t.id) return;
  if(t.id==='auth-open') openAuth('in');
  else if(t.id==='auth-close') closeAuth();
  else if(t.id==='authmodal'&&authMode!=='recovery') closeAuth();
  else if(t.id==='auth-out'&&sb){
    try{ if(ref){ clearTimeout(saveTimer); await flush(); } }catch(err){}
    await sb.auth.signOut();
    toast('Kamu sudah keluar.');
  }
  else if(t.id==='auth-google'&&sb){
    authBusy(true); authMsg('');
    try{ const r=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:backUrl()}}); if(r.error) throw r.error; }
    catch(err){ authMsg(authErr(err)); authBusy(false); }
  }
  else if(t.id==='auth-signup'&&sb){
    const email=$a('auth-email').value.trim(), pw=$a('auth-pw').value;
    if(!validEmail(email)){ authMsg('Isi email yang valid.'); return; }
    if(pw.length<8){ authMsg('Kata sandi minimal 8 karakter.'); return; }
    authBusy(true); authMsg('');
    try{
      const r=await sb.auth.signUp({email:email,password:pw,options:{emailRedirectTo:backUrl()}});
      if(r.error) throw r.error;
      if(r.data&&r.data.session){ closeAuth(); toast('Akun dibuat. Selamat datang!'); }
      else authMsg('Cek emailmu untuk konfirmasi, lalu masuk.',true);
    }catch(err){ authMsg(authErr(err)); }
    authBusy(false);
  }
  else if(t.id==='auth-forgot'&&sb){
    const email=$a('auth-email').value.trim();
    if(!validEmail(email)){ authMsg('Isi emailmu dulu, lalu klik Lupa kata sandi.'); return; }
    authBusy(true);
    try{ const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:backUrl()}); if(r.error) throw r.error; authMsg('Jika email terdaftar, tautan reset sudah dikirim.',true); }
    catch(err){ authMsg(authErr(err)); }
    authBusy(false);
  }
});
window.addEventListener('pageshow',e=>{ if(e.persisted) authBusy(false); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$a('authmodal')&&!$a('authmodal').hidden&&authMode!=='recovery') closeAuth(); });
$a('authform').addEventListener('submit',async e=>{
  e.preventDefault(); if(!sb) return;
  const pw=$a('auth-pw').value;
  authBusy(true); authMsg('');
  try{
    if(authMode==='recovery'){
      if(pw.length<8){ authMsg('Kata sandi minimal 8 karakter.'); authBusy(false); return; }
      const r=await sb.auth.updateUser({password:pw}); if(r.error) throw r.error;
      closeAuth(); toast('Kata sandi diperbarui.');
    } else {
      const email=$a('auth-email').value.trim();
      if(!validEmail(email)||!pw){ authMsg('Isi email dan kata sandi.'); authBusy(false); return; }
      const r=await sb.auth.signInWithPassword({email:email,password:pw}); if(r.error) throw r.error;
      closeAuth(); toast('Berhasil masuk.');
    }
  }catch(err){ authMsg(authErr(err)); }
  authBusy(false);
});

function cleanProposal(arr){
  if(!Array.isArray(arr)) return null;
  const out=arr.filter(x=>x&&typeof x.title==='string'&&x.title.trim()).slice(0,8).map(x=>({
    title:x.title.trim().slice(0,90),
    deadline:(typeof x.deadline==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.deadline))?x.deadline:todayStr()
  }));
  return out.length?out:null;
}
async function breakdown(text){
  if(sb&&session){
    try{
      const cur=await sb.auth.getSession();
      const tok=cur&&cur.data&&cur.data.session?cur.data.session.access_token:null;
      if(tok){
        const r=await fetch('/.netlify/functions/breakdown',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},body:JSON.stringify({text:text,today:todayStr()})});
        if(r.status===429) toast('Batas penggunaan AI hari ini sudah habis. Pekerjaan dipecah dengan aturan sederhana.');
        else if(r.ok){ const j=await r.json(); const p=cleanProposal(j&&j.tasks); if(p) return {tasks:p,mode:'ai'}; }
      }
    }catch(e){}
  }
  return {tasks:splitTasks(text,todayDate()),mode:'local'};
}

function trendSvg(data){
  const W=640,H=270,L=54,R=12,T=14,B=34, pw=W-L-R, ph=H-T-B;
  const max=niceMax(Math.max.apply(null,data.map(d=>Math.max(d.income,d.expense)).concat([1])));
  const y=v=>T+ph-(v/max)*ph, g=pw/data.length, bw=Math.min(28,g*0.3);
  const top=(x,yy,w,h,r)=>h<=0?'':'M'+x+' '+(yy+h)+'V'+(yy+Math.min(r,h))+'Q'+x+' '+yy+' '+(x+Math.min(r,h))+' '+yy+'H'+(x+w-Math.min(r,h))+'Q'+(x+w)+' '+yy+' '+(x+w)+' '+(yy+Math.min(r,h))+'V'+(yy+h)+'Z';
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Pemasukan dan pengeluaran per bulan, enam bulan terakhir">';
  const lead=max/Math.pow(10,Math.floor(Math.log10(max))), nt=lead===5?5:4;
  for(let i=0;i<=nt;i++){ const v=max*i/nt, yy=y(v); s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="#E3DFD2" stroke-width="1"/><text x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="#76695A">'+shortRp(v)+'</text>'; }
  data.forEach((d,i)=>{
    const cx=L+g*i+g/2, x1=cx-bw-1, x2=cx+1, last=i===data.length-1;
    [[x1,d.income,'#2a78d6','Pemasukan'],[x2,d.expense,'#eb6834','Pengeluaran']].forEach(b=>{
      const h=(b[1]/max)*ph;
      s+='<path d="'+top(b[0],y(b[1]),bw,h,4)+'" fill="'+b[2]+'" data-tip="'+esc(monthLabel(d.key)+' · '+b[3]+' '+rp(b[1]))+'" tabindex="0" aria-label="'+esc(monthLabel(d.key)+', '+b[3]+' '+rp(b[1]))+'"/>';
      if(last&&b[1]>0) s+='<text x="'+(b[0]+bw/2)+'" y="'+(y(b[1])-5)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#4A3F35">'+shortRp(b[1])+'</text>';
    });
    s+='<text x="'+cx+'" y="'+(H-12)+'" text-anchor="middle" font-size="12" fill="#76695A" font-weight="'+(last?700:400)+'">'+monthShort(d.key)+'</text>';
  });
  return s+'</svg>';
}

  '<div class="card">'+h2b('Ringkasan '+esc(monthLabel(key)),'bulb','butter')+'<ul class="insights">'+ins.map(i=>'<li>'+badge(i.ic,'#FDF1DD','#C9762E',24)+'<span>'+esc(i.t)+'</span></li>').join('')+'</ul></div>'+
  '<div style="display:flex;flex-direction:column;gap:22px"><div class="card">'+h2b('Pengeluaran per kategori','coin','coral')+''+
   (s.byCat.length?'<div class="bars">'+s.byCat.map(c=>'<div class="bar-row"><span>'+esc(c.cat)+'</span><div class="track"><div class="fill" style="width:'+Math.max(3,c.amount/maxCat*100)+'%" data-tip="'+esc(c.cat+' · '+rp(c.amount)+' ('+Math.round(c.amount/s.expense*100)+'%)')+'"></div></div><span class="amt">'+rp(c.amount)+' <span class="muted" style="font-weight:400">'+Math.round(c.amount/s.expense*100)+'%</span></span></div>').join('')+'</div>':'<p class="empty">Belum ada pengeluaran bulan ini.</p>')+'</div>'+
   '<div class="card">'+h2b('Tren 6 bulan','up','sky')+'<div class="legend"><span><i style="background:#2a78d6"></i>Pemasukan</span><span><i style="background:#eb6834"></i>Pengeluaran</span></div><div class="chartbox">'+trendSvg(tr)+'</div>'+
   '<details><summary>Lihat sebagai tabel</summary><div class="tablewrap"><table><thead><tr><th>Bulan</th><th class="num">Pemasukan</th><th class="num">Pengeluaran</th><th class="num">Saldo</th></tr></thead><tbody>'+tr.map(d=>'<tr><td>'+esc(monthLabel(d.key))+'</td><td class="num">'+rp(d.income)+'</td><td class="num">'+rp(d.expense)+'</td><td class="num">'+rp(d.income-d.expense)+'</td></tr>').join('')+'</tbody></table></div></details></div></div>'+
  '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">'+h2b('Riwayat transaksi','tasks','lilac',true)+'<button class="btn ghost small" type="button" data-act="copy-csv">'+ic('copy',15)+'Salin CSV bulan ini</button></div>'+
   '<div id="csvbox"></div>'+
   (list.length?'<div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Kategori</th><th>Catatan</th><th class="num">Jumlah</th><th><span style="position:absolute;left:-9999px">Aksi</span></th></tr></thead><tbody>'+list.map(x=>'<tr><td>'+esc(dayLabel(x.date))+'</td><td>'+esc(x.cat)+'</td><td class="muted">'+esc(x.note||'')+'</td><td class="num '+(x.type==='in'?'inc':'exp')+'" style="font-weight:700">'+(x.type==='in'?'+':'-')+rp(x.amount).replace('-','')+'</td><td><button class="icon-btn" type="button" data-act="del-tx" data-id="'+esc(x.id)+'" aria-label="Hapus transaksi">'+ic('trash',16)+'</button></td></tr>').join('')+'</tbody></table></div>':'<p class="empty">Belum ada transaksi di bulan ini.</p>')+'</div></div>';
}

/* ---------- Render & event ---------- */
function render(){
  renderNav();
  const r=route(), v=document.getElementById('view');
  v.innerHTML = r==='checklist'?vChecklist():r==='support'?vSupport():r==='fokus-ai'?vFokusAI():r==='refleksi'?vRefleksi():r==='keuangan'?vKeuangan():vBeranda();
  document.title='NEBULA';
  if(r==='fokus-ai'){ const l=document.getElementById('chatlog'); if(l) l.scrollTop=l.scrollHeight; }
}
window.addEventListener('hashchange',()=>{ S.checks=S.checks.filter(c=>c.title.trim()); ui.editId=null; render(); window.scrollTo(0,0); });

let toastTimer=null, undo=null;
function toast(msg,undoFn){
  const t=document.getElementById('toast'); undo=undoFn||null;
  t.innerHTML='<span>'+esc(msg)+'</span>'+(undoFn?'<button type="button" data-act="undo">Urungkan</button>':'');
  t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),5000);
}
const parseAmount = v => parseInt(String(v).replace(/\D/g,''),10)||0;

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act;
  if(act==='side-toggle'){ setSide(!document.querySelector('.app').classList.contains('collapsed')); if(!document.querySelector('.app').classList.contains('collapsed')){ const a=document.querySelector('.navlink[aria-current]'); if(a) a.focus(); } else document.getElementById('showside').focus(); }
  else if(act==='load-demo'){ S=seed(); save(); render(); }
  else if(act==='goal-toggle'){ const g=S.goals.find(x=>x.id===el.dataset.id); if(g){ g.done=!g.done; if(g.done) g.progress=100; else g.progress=Math.min(g.progress||0,95); save(); render(); } }
  else if(act==='goal-del'){ const i=S.goals.findIndex(x=>x.id===el.dataset.id); if(i>=0){ const gone=S.goals.splice(i,1)[0]; save(); render(); toast('Target dihapus.',()=>{ S.goals.push(gone); save(); render(); }); } }
  else if(act==='open-goals'){ const r=document.getElementById('sec-target'); if(r) r.scrollIntoView({block:'start',behavior:'smooth'}); }
  else if(act==='ck-add'){ addCheck(el.closest('ul')); }
  else if(act==='ck-toggle'){ const c=S.checks.find(x=>x.id===el.dataset.id); if(c){ c.done=!c.done; save(); render(); } }
  else if(act==='ck-del'){ const i=S.checks.findIndex(x=>x.id===el.dataset.id); if(i>=0){ const gone=S.checks.splice(i,1)[0]; save(); render(); toast('Item dihapus.',()=>{ S.checks.push(gone); save(); render(); }); } }
  else if(act==='ck-week'){ const d=+el.dataset.d; ui.weekOffset=d===0?0:ui.weekOffset+d; render(); }
  else if(act==='clear-demo'){ S=blank(); save(); render(); }
  else if(act==='flag'){
    const k=el.dataset.k, i=ui.checkin.indexOf(k);
    if(i>=0) ui.checkin.splice(i,1);
    else { if(k==='oke') ui.checkin=['oke']; else { ui.checkin=ui.checkin.filter(x=>x!=='oke'); ui.checkin.push(k); } }
    document.getElementById('chips').innerHTML=chipsHtml();
  }
  else if(act==='month'){ const n=shiftMonth(ui.month,+el.dataset.d); if(n<=monthKey(todayStr())){ ui.month=n; ui.csv=null; render(); } }
  else if(act==='txtype'){
    ui.txType=el.dataset.v;
    document.querySelectorAll('.seg button').forEach(b=>{ const on=b.dataset.v===ui.txType; b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); });
    document.getElementById('tx-cat').innerHTML=catOptions(ui.txType);
  }
  else if(act==='del-tx'){ const i=S.tx.findIndex(t=>t.id===el.dataset.id); if(i>=0){ const gone=S.tx.splice(i,1)[0]; save(); render(); toast('Transaksi dihapus.',()=>{ S.tx.push(gone); save(); render(); }); } }
  else if(act==='undo'){ if(undo){ undo(); undo=null; document.getElementById('toast').classList.remove('show'); } }
  else if(act==='copy-csv'){
    const rows=S.tx.filter(x=>monthKey(x.date)===ui.month).sort((a,b)=>a.date.localeCompare(b.date));
    const csv=toCsv(rows); const box=document.getElementById('csvbox');
    let ok=false; try{ await navigator.clipboard.writeText(csv); ok=true; }catch(err){}
    box.innerHTML = ok ? '<p class="msgline">CSV disalin ke clipboard ('+rows.length+' transaksi).</p>' : '<p class="msgline err">Browser menolak menyalin otomatis. Salin manual dari kotak di bawah.</p><textarea id="csvtext" readonly>'+esc(csv)+'</textarea>';
    if(!ok){ const ta=document.getElementById('csvtext'); if(ta){ ta.focus(); ta.select(); } }
  }
  else if(act==='ai-add'){
    const m=ui.chat[+el.dataset.i];
    if(m&&m.proposal&&m.status==='pending'){ m.proposal.forEach(p=>S.checks.push({id:uid(),date:p.deadline,title:p.title,done:false})); m.status='added'; save(); document.getElementById('chatlog').innerHTML=chatHtml(); renderNav(); toast(m.proposal.length+' item ditambahkan ke Checklist.'); }
  }
  else if(act==='ai-skip'){ const m=ui.chat[+el.dataset.i]; if(m){ m.status='skipped'; document.getElementById('chatlog').innerHTML=chatHtml(); } }
});

function saveOpen(){ try{ localStorage.setItem('nebula-open',JSON.stringify(ui.open)); }catch(e){} }
document.addEventListener('toggle',e=>{ const d=e.target; if(d.tagName==='DETAILS'&&d.dataset.key){ ui.open[d.dataset.key]=d.open; saveOpen(); } },true);
function updSp(){ const a=document.getElementById('sp-send'); if(!a) return; a.href=waLink(spText(document.getElementById('sp-topic').value,document.getElementById('sp-msg').value)); }
document.addEventListener('change',e=>{ if(e.target.id==='sp-topic') updSp(); if(e.target.id==='gl-term'){ const dt=document.getElementById('gl-date'); if(dt) dt.value=ymd(addDays(todayDate(),e.target.value==='long'?90:7)); } });
document.addEventListener('input',e=>{
  if(e.target.id==='sp-msg') updSp();
  if(e.target.dataset&&e.target.dataset.goal){ const g=S.goals.find(x=>x.id===e.target.dataset.goal); if(g){ g.progress=+e.target.value; const l=e.target.parentNode.querySelector('.gpct'); if(l) l.textContent=g.progress+'%'; save(); } }
  if(e.target.classList&&e.target.classList.contains('ck-title')){ const c=S.checks.find(x=>x.id===e.target.dataset.ck); if(c){ c.title=e.target.value; save(); } }
  if(e.target.id==='tx-amount'){ const n=parseAmount(e.target.value); e.target.value=n?n.toLocaleString('id-ID'):''; }
  if(e.target.id==='rf-selesai') ui.draft.selesai=e.target.value;
  if(e.target.id==='rf-belum') ui.draft.belum=e.target.value;
  if(e.target.id==='rf-hambatan') ui.draft.hambatan=e.target.value;
});

document.addEventListener('submit',async e=>{
  const f=e.target.closest('[data-form]'); if(!f) return;
  e.preventDefault();
  const kind=f.dataset.form;
  if(kind==='goal'){
    const title=document.getElementById('gl-title').value.trim(), due=document.getElementById('gl-date').value, term=document.getElementById('gl-term').value;
    if(!title||!due) return;
    S.goals.push({id:uid(),title:title,term:term,due:due,done:false,progress:0}); save(); render();
  }
  else if(kind==='tx'){
    const msg=document.getElementById('tx-msg'), amount=parseAmount(document.getElementById('tx-amount').value), date=document.getElementById('tx-date').value;
    msg.className='msgline err';
    if(amount<=0){ msg.textContent='Isi nominal lebih dari 0.'; document.getElementById('tx-amount').focus(); return; }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ msg.textContent='Pilih tanggal transaksi.'; return; }
    S.tx.push({id:uid(),date:date,type:ui.txType,cat:document.getElementById('tx-cat').value,amount:amount,note:document.getElementById('tx-note').value.trim()});
    ui.month = monthKey(date)<=monthKey(todayStr()) ? monthKey(date) : ui.month;
    save(); render();
    const m2=document.getElementById('tx-msg'); if(m2){ m2.className='msgline'; m2.textContent=(ui.txType==='in'?'Pemasukan ':'Pengeluaran ')+rp(amount)+' tersimpan.'; }
  }
  else if(kind==='refl'){
    const date=todayStr(), cs=S.checks.filter(c=>c.date===date&&c.title.trim()), entry={date:date,selesai:cs.filter(c=>c.done).map(c=>c.title).join('; '),belum:cs.filter(c=>!c.done).map(c=>c.title).join('; '),hambatan:ui.draft.hambatan.trim(),checkin:ui.checkin.slice()};
    const msg=document.getElementById('rf-msg');
    if(!entry.selesai&&!entry.belum&&!entry.hambatan&&!entry.checkin.length){ msg.className='msgline err'; msg.textContent='Isi hambatan, tandai check-in, atau buat checklist hari ini dulu.'; return; }
    const i=S.refl.findIndex(r=>r.date===date); if(i>=0) S.refl[i]=entry; else S.refl.push(entry);
    ui.draft={selesai:'',belum:'',hambatan:''}; ui.checkin=[]; save(); render();
    const m2=document.getElementById('rf-msg'); if(m2){ m2.className='msgline'; m2.textContent='Refleksi hari ini tersimpan.'; }
  }
  else if(kind==='chat'){
    const inp=document.getElementById('chat-in'), text=inp.value.trim();
    if(!text||ui.thinking) return;
    inp.value=''; ui.chat.push({role:'me',text:text}); ui.thinking=true;
    const log=document.getElementById('chatlog'); log.innerHTML=chatHtml(); log.scrollTop=log.scrollHeight;
    const res=await breakdown(text);
    ui.thinking=false; ui.aiMode=res.mode;
    if(res.tasks.length) ui.chat.push({role:'bot',text:'Oke, aku pecah jadi beberapa aktivitas. Setujui kalau sudah pas, nanti kucatat ke Checklist di tanggal yang tertera:',proposal:res.tasks,status:'pending'});
    else ui.chat.push({role:'bot',text:'Aku belum bisa memecahnya. Coba tulis pekerjaannya dipisah koma, misalnya "baca paper, tulis laporan".'});
    if(route()==='fokus-ai'){ const l2=document.getElementById('chatlog'); if(l2){ l2.innerHTML=chatHtml(); l2.scrollTop=l2.scrollHeight; } const am=document.getElementById('aimode'); if(am) am.textContent=aiModeText(); }
  }
});

document.addEventListener('keydown',e=>{
  const t=e.target; if(!t.classList||!t.classList.contains('ck-title')) return;
  if(e.key==='Enter'){ e.preventDefault(); if(t.value.trim()) addCheck(t.closest('ul')); else t.blur(); }
  else if(e.key==='Escape'&&!t.value.trim()) t.blur();
});
document.addEventListener('focusout',e=>{
  const t=e.target; if(!t.classList||!t.classList.contains('ck-title')) return;
  const i=S.checks.findIndex(c=>c.id===t.dataset.ck);
  if(i>=0&&!S.checks[i].title.trim()){ S.checks.splice(i,1); const li=t.closest('li'); if(li) li.remove(); save(); }
  if(ui.editId===t.dataset.ck) ui.editId=null;
});

/* tooltip */
const tip=document.getElementById('tip');
function showTip(el,x,y){ const t=el.getAttribute('data-tip'); if(!t) return; tip.textContent=t; tip.style.display='block'; const w=tip.offsetWidth; tip.style.left=Math.max(8,Math.min(innerWidth-w-8,x+12))+'px'; tip.style.top=Math.max(8,y-38)+'px'; }
document.addEventListener('mousemove',e=>{ const el=e.target.closest&&e.target.closest('[data-tip]'); if(el) showTip(el,e.clientX,e.clientY); else tip.style.display='none'; });
document.addEventListener('focusin',e=>{ const el=e.target.closest&&e.target.closest('[data-tip]'); if(el){ const r=el.getBoundingClientRect(); showTip(el,r.left+r.width/2,r.top); } });
document.addEventListener('focusout',()=>{ tip.style.display='none'; });

function setSide(c){ document.querySelector('.app').classList.toggle('collapsed',c); try{ localStorage.setItem('focusos-side',c?'1':'0'); }catch(e){} }
document.getElementById('showside').innerHTML=ic('menu',22);
try{ if(localStorage.getItem('focusos-side')==='1') document.querySelector('.app').classList.add('collapsed'); }catch(e){}
render();
initDb();
(function(){
  const m=(location.hash+'&'+location.search).match(/error_description=([^&]+)/);
  if(!m) return;
  let d=''; try{ d=decodeURIComponent(m[1].replace(/\+/g,' ')); }catch(e){}
  setTimeout(()=>{ toast('Masuk gagal: '+(d||'coba lagi.')); try{ history.replaceState(null,'',location.pathname); }catch(e){} },800);
})();
})();
</script>
